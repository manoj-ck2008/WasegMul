# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Run independent configurable tasks in parallel.
org.gradle.parallel=true
# Cache task outputs between builds.
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
# All dependencies are AndroidX-native (minSdk 29); Jetifier only adds build time.
android.enableJetifier=false
# Disable build features that are unused to speed up configuration.
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

# App version (single source of truth)
VERSION_NAME=1.1.0
VERSION_CODE=2

# Parallel sync (Gradle 8.x; tooling property is no-op on 8.11, kept for future)
