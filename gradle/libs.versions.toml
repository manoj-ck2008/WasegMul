[versions]
agp = "8.7.3"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.8.7"
navigationCompose = "2.8.5"
lifecycleViewmodelCompose = "2.8.7"
activityCompose = "1.9.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
composeBom = "2024.11.00"
tensorflowLite = "2.17.0"
playServicesTflite = "16.5.0"
room = "2.6.1"
datastore = "1.1.1"
